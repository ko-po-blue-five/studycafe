<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학과 스터디 카페 좌석 예약 시스템</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK (v9/v10 Compat Web Scripts) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-indigo-900 text-white shadow-lg sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-3">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-book-open-reader text-2xl text-amber-400"></i>
                <h1 class="text-xl font-bold tracking-tight">학과 스터디 카페 예약 시스템</h1>
            </div>
            
            <div class="flex items-center space-x-3 text-sm">
                <button onclick="openAdminModal()" class="px-3 py-1 bg-indigo-800 hover:bg-indigo-700 text-amber-300 font-bold rounded-lg text-xs border border-indigo-700">
                    <i class="fa-solid fa-user-shield"></i> 관리자 로그
                </button>
                <div id="authHeader" class="flex items-center space-x-3 text-sm">
                    <!-- 로그인 상태 표시 영역 -->
                </div>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-6xl mx-auto px-4 py-6 flex-1 w-full space-y-6">

        <!-- Status Overview Dashboard -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-slate-500 uppercase">전체 좌석</p>
                    <p id="statTotal" class="text-2xl font-bold text-slate-800">12</p>
                </div>
                <div class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center text-slate-600">
                    <i class="fa-solid fa-chair"></i>
                </div>
            </div>

            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-emerald-600 uppercase">이용 가능</p>
                    <p id="statAvailable" class="text-2xl font-bold text-emerald-600">0</p>
                </div>
                <div class="w-10 h-10 rounded-full bg-emerald-50 flex items-center justify-center text-emerald-600">
                    <i class="fa-solid fa-circle-check"></i>
                </div>
            </div>

            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-indigo-600 uppercase">이용 중</p>
                    <p id="statOccupied" class="text-2xl font-bold text-indigo-600">0</p>
                </div>
                <div class="w-10 h-10 rounded-full bg-indigo-50 flex items-center justify-center text-indigo-600">
                    <i class="fa-solid fa-user-clock"></i>
                </div>
            </div>

            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-amber-600 uppercase">외출 중 (부재)</p>
                    <p id="statBreak" class="text-2xl font-bold text-amber-600">0</p>
                </div>
                <div class="w-10 h-10 rounded-full bg-amber-50 flex items-center justify-center text-amber-600">
                    <i class="fa-solid fa-person-walking-arrow-right"></i>
                </div>
            </div>
        </div>

        <!-- Rules Notice Banner -->
        <div class="bg-amber-50 border-l-4 border-amber-500 p-4 rounded-r-xl shadow-sm text-amber-900 text-sm flex items-start space-x-3">
            <i class="fa-solid fa-triangle-exclamation text-amber-500 text-lg mt-0.5"></i>
            <div>
                <p class="font-bold">자리 독점 및 좌석 정돈 안내</p>
                <p class="text-xs text-amber-800 mt-1">
                    퇴실 시 쓰레기와 소지품을 반드시 정리해 주세요. 로그인 유지시간은 10분입니다. 전 이용자의 뒷정리 미흡 건은 <span class="font-bold underline">[좌석 불청결 신고]</span> 버튼으로 접수되며 이용 기록이 추적됩니다.
                </p>
            </div>
        </div>

        <!-- Seat Grid Section -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-cubes text-indigo-600"></i> 실시간 좌석 배치도
                </h2>
                <div class="flex items-center space-x-4 text-xs font-medium">
                    <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-slate-200 border border-slate-300"></span> 이용가능</span>
                    <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-indigo-600"></span> 이용중</span>
                    <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-amber-500 animate-pulse"></span> 외출중</span>
                </div>
            </div>

            <div id="seatGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4">
                <!-- Dynamic Seat Cards -->
            </div>
        </div>

    </main>

    <!-- Modal: Login / Register -->
    <div id="authModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 space-y-6">
            <div class="flex border-b border-slate-200">
                <button id="tabLogin" onclick="switchAuthTab('login')" class="flex-1 py-3 text-center font-bold border-b-2 border-indigo-600 text-indigo-600">로그인</button>
                <button id="tabRegister" onclick="switchAuthTab('register')" class="flex-1 py-3 text-center font-bold border-b-2 border-transparent text-slate-400 hover:text-slate-600">신규 회원가입</button>
            </div>

            <!-- Login Form -->
            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">이름</label>
                    <input type="text" id="loginName" required placeholder="홍길동" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">학번 (비밀번호)</label>
                    <input type="password" id="loginStudentId" required maxlength="10" placeholder="학번 10자리 입력" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl transition">로그인하기</button>
            </form>

            <!-- Register Form -->
            <form id="registerForm" onsubmit="handleRegister(event)" class="space-y-4 hidden">
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">이름</label>
                    <input type="text" id="regName" required placeholder="홍길동" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">학번 (10자리)</label>
                    <input type="text" id="regStudentId" required maxlength="10" placeholder="예: 2026123456" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <button type="submit" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl transition">회원가입 완료</button>
            </form>

            <button onclick="closeModal('authModal')" class="w-full py-2 text-slate-400 hover:text-slate-600 text-xs text-center">닫기</button>
        </div>
    </div>

    <!-- Modal: Admin Logs -->
    <div id="adminModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl shadow-xl max-w-2xl w-full p-6 space-y-4 max-h-[85vh] flex flex-col">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="text-lg font-bold text-slate-800"><i class="fa-solid fa-clipboard-list text-indigo-600"></i> 좌석 이용 및 신고 기록</h3>
                <button onclick="closeModal('adminModal')" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>

            <!-- Password Form for Admin -->
            <div id="adminAuthBox" class="space-y-3 py-4">
                <p class="text-xs text-slate-500">관리자 전용 비밀번호를 입력해 주세요.</p>
                <div class="flex gap-2">
                    <input type="password" id="adminPw" placeholder="비밀번호 입력" class="flex-1 px-3 py-2 border rounded-lg text-sm">
                    <button onclick="verifyAdmin()" class="px-4 py-2 bg-indigo-600 text-white font-bold rounded-lg text-sm">확인</button>
                </div>
            </div>

            <!-- Log Table -->
            <div id="adminContent" class="hidden flex-1 overflow-y-auto space-y-4">
                <div class="flex justify-between items-center text-xs font-bold text-slate-500">
                    <span>최근 퇴실 및 신고 기록</span>
                    <button onclick="clearLogs()" class="text-rose-500 hover:underline">기록 전체 삭제</button>
                </div>
                <div class="border rounded-xl overflow-hidden">
                    <table class="w-full text-xs text-left">
                        <thead class="bg-slate-100 text-slate-600 font-bold border-b">
                            <tr>
                                <th class="p-2.5">유형</th>
                                <th class="p-2.5">좌석</th>
                                <th class="p-2.5">이용자(학번)</th>
                                <th class="p-2.5">시간</th>
                            </tr>
                        </thead>
                        <tbody id="logTableBody" class="divide-y divide-slate-100">
                            <!-- Dynamic Logs -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase Script Logic -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBNKlVehkC6GODaSJiVUerCbVxFGMBAIUU",
            authDomain: "studycafe-453d3.firebaseapp.com",
            databaseURL: "https://studycafe-453d3-default-rtdb.firebaseio.com",
            projectId: "studycafe-453d3",
            storageBucket: "studycafe-453d3.firebasestorage.app",
            messagingSenderId: "744296512627",
            appId: "1:744296512627:web:5e59cd49534672e5f07e06"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentUser = JSON.parse(localStorage.getItem('studycafe_user')) || null;
        const TOTAL_SEATS = 12;

        document.addEventListener("DOMContentLoaded", () => {
            checkAuthTimeout(); // 로드 시 10분 만료 여부 검사
            initSeatsInDB();
            renderAuthHeader();
            listenToDB();
            setInterval(checkAllBreakTimers, 1000);
            setInterval(checkAuthTimeout, 1000); // 1초마다 로그인 10분 만료 감시
        });

        function initSeatsInDB() {
            db.ref('seats').once('value', (snapshot) => {
                if (!snapshot.exists()) {
                    const initialSeats = {};
                    for (let i = 1; i <= TOTAL_SEATS; i++) {
                        initialSeats[i] = {
                            id: i,
                            status: 'AVAILABLE',
                            userName: null,
                            studentId: null,
                            checkInTime: null,
                            breakStartTime: null,
                            breakDurationMinutes: 30,
                            lastUser: null
                        };
                    }
                    db.ref('seats').set(initialSeats);
                }
            });
        }

        function listenToDB() {
            db.ref('seats').on('value', (snapshot) => {
                const seats = snapshot.val();
                if (seats) {
                    renderSeats(seats);
                    updateStats(seats);
                }
            });
        }

        function renderSeats(seats) {
            const grid = document.getElementById('seatGrid');
            grid.innerHTML = '';

            Object.values(seats).forEach(seat => {
                const card = document.createElement('div');
                card.className = "p-4 rounded-xl border transition flex flex-col justify-between h-48 shadow-sm relative ";

                if (seat.status === 'AVAILABLE') {
                    card.className += "bg-white border-slate-200 hover:border-indigo-400";
                    card.innerHTML = `
                        <div class="flex justify-between items-center">
                            <span class="font-bold text-slate-700 text-lg">${seat.id}번 좌석</span>
                            <span class="text-xs bg-slate-100 text-slate-500 px-2 py-0.5 rounded-full">이용가능</span>
                        </div>
                        <div class="text-center py-1 text-slate-300">
                            <i class="fa-solid fa-chair text-3xl"></i>
                        </div>
                        <div class="space-y-1">
                            <button onclick="handleSeatClick(${seat.id})" class="w-full py-1.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-600 font-bold rounded-lg text-xs">입실하기</button>
                            ${seat.lastUser ? `<button onclick="reportUnclean(${seat.id})" class="w-full py-1 bg-slate-100 hover:bg-rose-50 text-rose-500 font-medium rounded-lg text-[10px]">⚠️ 전 이용자 청결 신고</button>` : ''}
                        </div>
                    `;
                } else if (seat.status === 'OCCUPIED') {
                    const isMySeat = currentUser && currentUser.studentId === seat.studentId;
                    card.className += "bg-indigo-50/50 border-indigo-300";
                    card.innerHTML = `
                        <div class="flex justify-between items-center">
                            <span class="font-bold text-indigo-900 text-lg">${seat.id}번 좌석</span>
                            <span class="text-xs bg-indigo-600 text-white px-2 py-0.5 rounded-full font-bold">이용중</span>
                        </div>
                        <div class="text-xs text-indigo-900 space-y-1 my-auto">
                            <p class="font-bold text-sm">${maskName(seat.userName)} (${maskId(seat.studentId)})</p>
                            <p class="text-slate-500">입실: ${new Date(seat.checkInTime).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</p>
                        </div>
                        ${isMySeat ? `
                            <div class="grid grid-cols-2 gap-1.5">
                                <button onclick="startBreak(${seat.id})" class="py-1.5 bg-amber-500 hover:bg-amber-600 text-white font-bold rounded-lg text-xs">외출</button>
                                <button onclick="checkOut(${seat.id})" class="py-1.5 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-lg text-xs">퇴실</button>
                            </div>
                        ` : `
                            <button onclick="alert('본인 좌석만 제어할 수 있습니다.')" class="w-full py-1.5 bg-slate-200 text-slate-500 font-medium rounded-lg text-xs">사용 중</button>
                        `}
                    `;
                } else if (seat.status === 'BREAK') {
                    const isMySeat = currentUser && currentUser.studentId === seat.studentId;
                    card.className += "bg-amber-50 border-amber-300";
                    card.innerHTML = `
                        <div class="flex justify-between items-center">
                            <span class="font-bold text-amber-900 text-lg">${seat.id}번 좌석</span>
                            <span class="text-xs bg-amber-500 text-white px-2 py-0.5 rounded-full font-bold animate-pulse">외출 중</span>
                        </div>
                        <div class="text-xs text-amber-900 space-y-1 my-auto">
                            <p class="font-bold">${maskName(seat.userName)}</p>
                            <p id="breakTimer-${seat.id}" class="text-rose-600 font-bold">남은시간 계산중...</p>
                        </div>
                        ${isMySeat ? `
                            <button onclick="returnFromBreak(${seat.id})" class="w-full py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg text-xs">복귀하기</button>
                        ` : `
                            <button onclick="alert('현재 외출 중인 좌석입니다.')" class="w-full py-2 bg-amber-200 text-amber-700 font-medium rounded-lg text-xs">부재 중</button>
                        `}
                    `;
                }

                grid.appendChild(card);
            });
        }

        // 트랜잭션을 적용하여 다중 클릭 및 동시 예약을 완벽하게 차단하는 함수
        function handleSeatClick(seatId) {
            if (!currentUser) {
                alert("로그인이 필요한 서비스입니다.");
                openModal('authModal');
                return;
            }

            db.ref('seats').transaction((seats) => {
                if (seats) {
                    // 1. 선택한 좌석이 아직 비어있는지 확인
                    if (seats[seatId].status !== 'AVAILABLE') {
                        return; // 예약 불가 (트랜잭션 취소)
                    }

                    // 2. 현재 로그인한 학번이 이미 차지한 좌석이 있는지 엄격하게 검사
                    let alreadyHasSeat = false;
                    Object.values(seats).forEach(seat => {
                        // String()으로 감싸서 숫자/문자열 타입 차이로 인한 검사 누락 방지
                        if ((seat.status === 'OCCUPIED' || seat.status === 'BREAK') && 
                            String(seat.studentId) === String(currentUser.studentId)) {
                            alreadyHasSeat = true;
                        }
                    });

                    // 이미 예약한 자리가 있다면 데이터 변경 없이 트랜잭션 취소
                    if (alreadyHasSeat) {
                        return; 
                    }

                    // 3. 1인 1좌석 조건을 통과했다면 상태 업데이트
                    seats[seatId].status = 'OCCUPIED';
                    seats[seatId].userName = currentUser.name;
                    seats[seatId].studentId = currentUser.studentId;
                    seats[seatId].checkInTime = Date.now();
                    seats[seatId].breakStartTime = null;
                    seats[seatId].breakDurationMinutes = 30;
                    
                    return seats; // 변경된 상태를 DB에 안전하게 저장
                }
                return seats;
            }, (error, committed, snapshot) => {
                if (error) {
                    alert("예약 처리 중 통신 오류가 발생했습니다.");
                } else if (!committed) {
                    // 예약이 반려(취소)된 경우, 사유를 파악하여 정확한 안내 메시지 출력
                    const currentSeats = snapshot.val();
                    let occupiedSeatId = null;
                    
                    Object.values(currentSeats).forEach(seat => {
                        if ((seat.status === 'OCCUPIED' || seat.status === 'BREAK') && 
                            String(seat.studentId) === String(currentUser.studentId)) {
                            occupiedSeatId = seat.id;
                        }
                    });

                    if (occupiedSeatId) {
                        alert(`❌ 이미 ${occupiedSeatId}번 좌석을 이용 중입니다!\n(1인당 1개의 좌석만 예약할 수 있습니다)`);
                    } else {
                        alert("❌ 이미 다른 이용자가 예약한 좌석입니다.");
                    }
                }
            });
        }

        function startBreak(seatId) {
            const minutes = prompt("외출 시간을 분 단위로 입력하세요 (최대 30분):", "30");
            if (!minutes || isNaN(minutes) || minutes <= 0) return;

            db.ref('seats/' + seatId).update({
                status: 'BREAK',
                breakStartTime: Date.now(),
                breakDurationMinutes: parseInt(minutes)
            });
        }

        function returnFromBreak(seatId) {
            db.ref('seats/' + seatId).update({
                status: 'OCCUPIED',
                breakStartTime: null
            });
        }

        function checkOut(seatId) {
            if (confirm("퇴실하시겠습니까? (소지품과 쓰레기를 정돈해 주세요)")) {
                db.ref('seats/' + seatId).once('value', (snapshot) => {
                    const seat = snapshot.val();
                    if (seat && seat.userName) {
                        const lastUserInfo = {
                            userName: seat.userName,
                            studentId: seat.studentId,
                            checkOutTime: Date.now()
                        };

                        db.ref('logs').push({
                            type: 'EXIT',
                            seatId: seat.id,
                            userName: seat.userName,
                            studentId: seat.studentId,
                            time: Date.now()
                        });

                        db.ref('seats/' + seatId).set({
                            id: seatId,
                            status: 'AVAILABLE',
                            userName: null,
                            studentId: null,
                            checkInTime: null,
                            breakStartTime: null,
                            breakDurationMinutes: 30,
                            lastUser: lastUserInfo
                        });
                    }
                });
            }
        }

        function reportUnclean(seatId) {
            if (!currentUser) {
                alert("로그인 후 신고가 가능합니다.");
                openModal('authModal');
                return;
            }

            if (confirm("전 이용자가 좌석을 정돈하지 않고 퇴실했습니까? 신고 내역이 관리자에게 전달됩니다.")) {
                db.ref('seats/' + seatId).once('value', (snapshot) => {
                    const seat = snapshot.val();
                    if (seat && seat.lastUser) {
                        db.ref('logs').push({
                            type: 'REPORT',
                            seatId: seat.id,
                            userName: seat.lastUser.userName,
                            studentId: seat.lastUser.studentId,
                            reporterName: currentUser.name,
                            reporterId: currentUser.studentId,
                            time: Date.now()
                        });
                        alert("신고가 접수되었습니다. 관리자가 내역을 확인합니다.");
                    }
                });
            }
        }
